name: Validate Skill

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build ccswitch archive
        run: python tools/package_ccswitch.py
      - name: Verify archive
        run: python -m zipfile -t dist/literature-deep-reading-assistant-v$(cat VERSION)-ccswitch.zip
